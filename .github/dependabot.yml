# Dependabot version updates (roadmap IN01). Dependabot alerts are switched
# on in the repository settings; this file adds weekly update pull requests
# that CI checks like any other. Grouped, so a week brings a handful of pull
# requests instead of one per package.
version: 2
updates:
  # The pnpm workspace: the root package.json, apps/cms, apps/web,
  # packages/domain and pnpm-lock.yaml.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      # All @strapi/* packages stay on one version (lockstep).
      strapi:
        patterns: ["@strapi/*"]
      # Next.js and its ESLint config move together.
      nextjs:
        patterns: ["next", "@next/*", "eslint-config-next"]
      # Everything else: one pull request for the week's minor and patch
      # updates. A major update comes on its own.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The type definitions follow the Node line of the images (Node 24).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Only in apps/cms for the Strapi admin's peer dependency, which is
      # ^6 in Strapi 5.
      - dependency-name: react-router-dom
        update-types: ["version-update:semver-major"]
      # The Strapi 5 admin needs React 18 (peer ^18.0.0), so apps/cms stays on
      # it; a React 19 in apps/cms fails the admin build. apps/web's React
      # major moves with a Next.js major, not with a weekly bump.
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is the native compiler with a new package layout (no
      # bin/tsc export). typescript-eslint supports <6.1, Strapi 5.58 itself
      # depends on 5.9.3, and Next builds through the TypeScript 5 API. Move
      # when they support it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  # The base image of both Dockerfiles (node:24-alpine, pinned by digest):
  # new digests of the same tag. Moving to another Node major is a planned
  # change (engines, CI, both images), not a weekly bump.
  - package-ecosystem: docker
    directories: ["/apps/cms", "/apps/web"]
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    commit-message:
      prefix: build
      include: scope
    # Both images in one pull request: infra/build-pins.test.ts requires the
    # same digest in both Dockerfiles, so a bump of one alone fails CI.
    groups:
      node-image:
        group-by: dependency-name
        patterns: ["node"]
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  # The compose images, pinned by digest (v0.32): new digests of the same
  # tag. Never a Postgres major (it needs a dump and restore) or a Caddy
  # major (a new config format); Meilisearch stays as pinned (a new version
  # may not open the old index files).
  - package-ecosystem: docker-compose
    directory: /infra
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    commit-message:
      prefix: build
      include: scope
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      - dependency-name: caddy
        update-types: ["version-update:semver-major"]
      - dependency-name: getmeili/meilisearch

  # The actions used in .github/workflows, in one pull request. They are
  # pinned to commit SHAs with the tag in a trailing comment
  # (`uses: owner/action@<sha> # vX.Y.Z`); Dependabot updates both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
