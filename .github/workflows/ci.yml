name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck · lint · build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack (pnpm 9.12.0)
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate

      # Node 24 matches the runtime baked into both Dockerfiles (node:24-alpine).
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Advisory only: a failed audit must not block the pipeline.
      - name: Audit production dependencies (non-blocking)
        run: pnpm audit --prod --audit-level=high
        continue-on-error: true

  # Datetime contract (docs/DEPLOYMENT.md): the whole suite once per process
  # time zone, with the Postgres 16 integration suites (*.pg.test.ts: the
  # timestamptz guard, the one-time repair through Strapi's own migration
  # runner, the read-only report) switched on by SINNLOS_TEST_PG_URL. Gate
  # for every Strapi, knex or pg upgrade.
  datetime:
    name: datetime · TZ matrix · Postgres 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sinnlos
          POSTGRES_PASSWORD: sinnlos
          POSTGRES_DB: sinnlos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sinnlos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SINNLOS_TEST_PG_URL: postgres://sinnlos:sinnlos@localhost:5432/sinnlos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack (pnpm 9.12.0)
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # UTC, Europe/Berlin, Pacific/Auckland (scripts/test-tz.mjs).
      - name: Test under three process time zones, with Postgres 16
        run: pnpm test:tz
