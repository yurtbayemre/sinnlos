name: CI

# Pull requests (any branch) and pushes to main. A branch without a pull
# request runs CI through "Run workflow" (workflow_dispatch).
# docs/**/*.md changes only need formatting; README contracts and all other
# paths keep application checks. Frontend-only changes keep timezone tests
# without databases; CMS/shared/infra/dependency/config changes need databases.
# E2E owns a separate disposable DB; its scope is independent of database tests.
# Manual runs always run every check.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Push this commit's arm64 images to the private ghcr.io packages (job publish)
        type: boolean
        default: false

# The jobs only read the repository; publish also writes its two packages.
# The buildx layer cache (type=gha) uses the runner's own cache token, not
# GITHUB_TOKEN.
permissions:
  contents: read

# Every action is pinned to a full commit SHA, with its release tag in a
# trailing comment (`@<sha> # vX.Y.Z`): a moved or re-pointed tag cannot
# change what runs here. Dependabot (.github/dependabot.yml, github-actions)
# proposes the next release's SHA and rewrites the comment;
# infra/build-pins.test.ts refuses an unpinned `uses:`.

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: CI scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
      database: ${{ steps.scope.outputs.database }}
      postgres: ${{ steps.pins.outputs.postgres }}
      e2e: ${{ steps.scope.outputs.e2e }}
    steps:
      - name: Checkout history for PR and push comparisons
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Test CI scope
        run: node --test scripts/ci-scope.test.mjs

      - name: Determine CI scope
        id: scope
        run: node scripts/ci-scope.mjs

      - name: Read the Postgres image the compose file pins
        id: pins
        run: |
          image="$(sed -n 's/^    image: \(postgres:[^ ]*\)$/\1/p' infra/docker-compose.yml)"
          test -n "$image"
          echo "postgres=$image" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    # Keep this existing check failing when scope detection fails.
    if: ${{ !cancelled() }}
    name: typecheck · lint · build
    env:
      SINNLOS_TEST_CMS: ${{ needs.changes.outputs.database }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require successful scope detection
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable Corepack (pnpm 10.34.6)
        run: |
          corepack enable
          corepack prepare pnpm@10.34.6 --activate

      # Node 24 matches the runtime baked into both Dockerfiles (node:24-alpine).
      - name: Setup Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile ${{ needs.changes.outputs.full != 'true' && '--ignore-scripts' || '' }}

      # packages/domain (SH01) ships dist/cjs + dist/esm; the apps' typecheck
      # and build and the package's dist test (packages/domain/src/
      # dist.test.ts, required under CI) read it.
      - name: Build @sinnlos/domain
        if: needs.changes.outputs.full == 'true'
        run: pnpm build:domain

      - name: Typecheck
        if: needs.changes.outputs.full == 'true'
        run: pnpm typecheck

      - name: Lint
        if: needs.changes.outputs.full == 'true'
        run: pnpm lint

      # Blocking since the format sweep after batch 10. The two long
      # hand-formatted docs are in .prettierignore.
      - name: Format check (prettier)
        run: pnpm format:check

      - name: Test
        if: needs.changes.outputs.full == 'true'
        run: pnpm test

      - name: Build
        if: needs.changes.outputs.full == 'true'
        run: pnpm build

      # Blocking: a critical advisory in a production dependency fails the
      # run (fix it with an update or a scoped pnpm override).
      - name: Audit production dependencies (critical, blocking)
        if: needs.changes.outputs.full == 'true'
        run: pnpm audit --prod --audit-level=critical

      # Advisory only: high findings are reported without blocking.
      - name: Audit production dependencies (high, non-blocking)
        if: needs.changes.outputs.full == 'true'
        run: pnpm audit --prod --audit-level=high
        continue-on-error: true

  # Datetime contract (docs/OPERATIONS.md): the whole suite once per process
  # time zone, with the Postgres 16 integration suites (*.pg.test.ts: the
  # timestamptz guard and the datetime migration stub through Strapi's own
  # migration runner) switched on by SINNLOS_TEST_PG_URL. Gate
  # for every Strapi, knex or pg upgrade.
  datetime:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    name: datetime · TZ matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: ${{ needs.changes.outputs.database == 'true' && needs.changes.outputs.postgres || '' }}
        env:
          POSTGRES_USER: sinnlos
          POSTGRES_PASSWORD: sinnlos
          POSTGRES_DB: sinnlos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sinnlos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SINNLOS_TEST_CMS: ${{ needs.changes.outputs.database }}
      SINNLOS_TEST_PG_URL: ${{ needs.changes.outputs.database == 'true' && 'postgres://sinnlos:sinnlos@localhost:5432/sinnlos' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable Corepack (pnpm 10.34.6)
        run: |
          corepack enable
          corepack prepare pnpm@10.34.6 --activate

      - name: Setup Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @sinnlos/domain
        run: pnpm build:domain

      # UTC, Europe/Berlin, Pacific/Auckland (scripts/test-tz.mjs).
      - name: Test under three process time zones
        run: pnpm test:tz

  # Strapi-in-process integration suite (roadmap S11, `pnpm test:integration`,
  # apps/cms/src/integration/): the real cms, compiled once, booted per suite
  # with its real register()/bootstrap() on a fresh SQLite file and, through
  # SINNLOS_TEST_PG_URL, a fresh Postgres 16 schema, and driven over HTTP
  # with one account per role. Separate from the TZ matrix: the suite pins
  # TZ=UTC itself (vitest.integration.config.ts), as the container does.
  integration:
    needs: changes
    if: needs.changes.outputs.database == 'true'
    name: integration · SQLite + Postgres 16
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: ${{ needs.changes.outputs.postgres }}
        env:
          POSTGRES_USER: sinnlos
          POSTGRES_PASSWORD: sinnlos
          POSTGRES_DB: sinnlos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sinnlos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # The optional search (v0.21): the cms indexer's suite against the
      # Meilisearch release infra/docker-compose.yml pins (MEILI_TEST_URL;
      # the suite skips without it). The master key is a CI-only literal.
      meilisearch:
        image: getmeili/meilisearch:v1.54.3@sha256:e68913ab7d6f5b159529e472cfd362ce3c741fafd3c127961b2142abbe41b3c9
        env:
          MEILI_MASTER_KEY: ci-only-meili-master-key-0123456789
          MEILI_NO_ANALYTICS: "true"
        ports:
          - 7700:7700
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:7700/health || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SINNLOS_TEST_PG_URL: postgres://sinnlos:sinnlos@localhost:5432/sinnlos
      MEILI_TEST_URL: http://localhost:7700
      MEILI_TEST_MASTER_KEY: ci-only-meili-master-key-0123456789
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable Corepack (pnpm 10.34.6)
        run: |
          corepack enable
          corepack prepare pnpm@10.34.6 --activate

      - name: Setup Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @sinnlos/domain
        run: pnpm build:domain

      - name: Strapi integration suite (SQLite + Postgres 16)
        run: pnpm test:integration

  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    name: e2e · browser
    runs-on: ubuntu-latest
    # Runner bounds build/start/browser work; leave time for cleanup and upload.
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable Corepack (pnpm 10.34.6)
        run: |
          corepack enable
          corepack prepare pnpm@10.34.6 --activate

      - name: Setup Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile

      - name: Install Chromium and system libraries
        timeout-minutes: 5
        run: pnpm --filter @sinnlos/e2e exec playwright install --with-deps chromium

      # Same entry point as local runs, including fresh fixtures and finally cleanup.
      - name: Run browser E2E tests
        timeout-minutes: 36
        run: pnpm test:e2e

      - name: Upload E2E diagnostics
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-browser-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          include-hidden-files: true
          # Never upload .e2e/runs (private env/fixtures), only these diagnostics.
          path: |
            .e2e/report/
            .e2e/results/
            .e2e/logs/

  # The deployment files themselves: shell scripts and the compose files as
  # docker compose renders them. No Node needed.
  infra:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    name: infra · shellcheck · compose config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Every tracked *.sh plus extensionless files with a shell shebang.
      # Blocking since the sweep after batch 10.
      - name: shellcheck
        run: |
          mapfile -t scripts < <(git ls-files '*.sh')
          while IFS= read -r file; do scripts+=("${file}"); done \
            < <(git grep -lE '^#!(/usr/bin/env |/bin/)(ba)?sh' -- ':!*.sh' || true)
          printf 'shellcheck %s\n' "${scripts[@]}"
          docker run --rm -v "${PWD}:/mnt:ro" -w /mnt koalaman/shellcheck:v0.11.0 "${scripts[@]}"

      # infra/.env.example leaves the required secrets empty (compose
      # refuses to render without them), so dummy values fill them in.
      - name: Compose files render (Caddy mode, Traefik mode, search profile)
        run: |
          secrets="${RUNNER_TEMP}/compose-ci.env"
          cat > "${secrets}" <<'EOF'
          DATABASE_PASSWORD=ci-dummy
          APP_KEYS=ci-dummy-1,ci-dummy-2
          API_TOKEN_SALT=ci-dummy
          ADMIN_JWT_SECRET=ci-dummy
          TRANSFER_TOKEN_SALT=ci-dummy
          JWT_SECRET=ci-dummy
          ENCRYPTION_KEY=ci-dummy
          AUTH_SECRET=ci-dummy
          REVALIDATE_SECRET=ci-dummy
          INTERNAL_UPLOAD_TOKEN=ci-dummy
          EOF
          compose() {
            docker compose --env-file infra/.env.example --env-file "${secrets}" \
              -f infra/docker-compose.yml "$@"
          }
          echo "Caddy mode (base file only)"
          compose config -q
          echo "Caddy mode without DOMAIN serves localhost"
          test "$(DOMAIN='' compose config --format json | jq -r '.services.caddy.environment.DOMAIN')" = localhost
          echo "Traefik mode"
          compose -f infra/docker-compose.traefik.yml config -q
          echo "Traefik mode: every router rule takes its Host from DOMAIN"
          compose -f infra/docker-compose.traefik.yml config --format json | jq -e '
            [.services[] | (.labels // {}) | to_entries[]
              | select(.key | test("^traefik\\.http\\.routers\\.[^.]+\\.rule$")) | .value]
            | length > 0 and all(startswith("Host(`intranet.example.com`)"))'
          echo "Traefik mode: the sinnlos-* aliases stay on the project network"
          compose -f infra/docker-compose.traefik.yml config --format json | jq -e '
            .services.db.networks.default.aliases == ["sinnlos-db"]
            and .services.cms.networks.default.aliases == ["sinnlos-cms"]
            and .services.web.networks.default.aliases == ["sinnlos-web"]
            and (.services.cms.networks.frontend.aliases // []) == []
            and (.services.web.networks.frontend.aliases // []) == []'
          echo "Traefik mode refuses to render without DOMAIN"
          if DOMAIN='' compose -f infra/docker-compose.traefik.yml config -q 2> "${RUNNER_TEMP}/domain.err"; then
            echo "::error::docker-compose.traefik.yml rendered without DOMAIN"
            exit 1
          fi
          grep -q 'required variable DOMAIN is missing a value' "${RUNNER_TEMP}/domain.err"
          echo "Optional search: meili only with its profile, on the project network only"
          compose -f infra/docker-compose.traefik.yml config --format json | jq -e '.services.meili == null'
          COMPOSE_PROFILES=search compose -f infra/docker-compose.traefik.yml config --format json | jq -e '
            .services.meili.networks == {"default": {"aliases": ["sinnlos-meili"]}}
            and (.services.meili.ports // []) == []
            and (.services.meili.labels // {}) == {}'

      # v0.29: the site gate (SITE_ALLOW_CIDRS). The Caddyfile validates open
      # and closed with the caddy service's own command (run → validate),
      # then serves both states in front of two busybox upstreams named web
      # and cms: open, a normal answer with the security headers; closed, a
      # 503 with them, on a web and a cms path. The Traefik override puts the
      # gate on all five routers, after the headers.
      - name: Site gate (Caddy open and closed, Traefik routers)
        run: |
          secrets="${RUNNER_TEMP}/compose-ci.env"
          compose() {
            docker compose --env-file infra/.env.example --env-file "${secrets}" \
              -f infra/docker-compose.yml "$@"
          }
          config="$(compose config --format json)"
          cmd="$(jq -r '.services.caddy.command[2]' <<<"${config}" | sed -e 's/\$\$/$/g')"
          # The image the compose file pins (v0.32, #196): CI checks the edge a host runs.
          image="$(jq -er '.services.caddy.image' <<<"${config}")"
          docker network create gate-ci
          for upstream in web:3000 cms:1337; do
            docker run -d --rm --name "gate-${upstream%%:*}" --network gate-ci \
              --network-alias "${upstream%%:*}" busybox:1.37 httpd -f -p "${upstream##*:}" -h /etc
          done
          for cidrs in "" "203.0.113.7/32,2001:db8::/32"; do
            echo "Caddyfile with SITE_ALLOW_CIDRS='${cidrs}'"
            docker run --rm -e DOMAIN=intranet.example.com -e "SITE_ALLOW_CIDRS=${cidrs}" \
              -v "${PWD}/infra/Caddyfile:/etc/caddy/Caddyfile:ro" "${image}" \
              sh -c "${cmd/exec caddy run /exec caddy validate }"
            docker run -d --rm --name gate-caddy --network gate-ci -p 18080:80 \
              -e DOMAIN=http://localhost -e "SITE_ALLOW_CIDRS=${cidrs}" \
              -v "${PWD}/infra/Caddyfile:/etc/caddy/Caddyfile:ro" "${image}" sh -c "${cmd}"
            for _ in $(seq 20); do curl -s -o /dev/null http://127.0.0.1:18080/ && break; sleep 0.5; done
            # Open: busybox's own answers (a file, a missing path). Closed: 503.
            for probe in /hostname:200 /api/x:404; do
              path="${probe%%:*}"
              want="${probe##*:}"
              [[ -z "${cidrs}" ]] || want=503
              head="$(curl -s -D - -o /dev/null -H 'Host: localhost' -H 'X-Forwarded-For: 203.0.113.7' \
                "http://127.0.0.1:18080${path}")"
              printf '%s %s\n' "${path}" "$(head -n 1 <<<"${head}")"
              grep -q "^HTTP/1.1 ${want} " <<<"${head}"
              grep -qi '^x-content-type-options: nosniff' <<<"${head}"
              grep -qi '^x-frame-options: deny' <<<"${head}"
            done
            docker stop gate-caddy
          done
          docker stop gate-web gate-cms
          docker network rm gate-ci
          echo "Traefik: the gate on every router, with the listed range"
          SITE_ALLOW_CIDRS=203.0.113.7/32 compose -f infra/docker-compose.traefik.yml \
            config --format json | jq -e '
            [.services[] | (.labels // {}) | to_entries[]] as $labels
            | ([$labels[] | select(.key | test("^traefik\\.http\\.routers\\.[^.]+\\.middlewares$"))
                | .value | split(",") | .[1] | endswith("site-allow")] | length == 5 and all)
              and ([$labels[] | select(.key | test("site-allow\\.ipallowlist\\.sourcerange$")) | .value]
                | length == 2 and all(. == "203.0.113.7/32"))'

  # Both production images build from a clean checkout, exactly as
  # infra/deploy.sh builds them (context = repo root). Nothing is pushed;
  # the layer cache lives in the GitHub Actions cache, one scope per image.
  images:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    name: images · ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [cms, web]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build apps/${{ matrix.app }}/Dockerfile (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          load: ${{ matrix.app == 'cms' }}
          tags: sinnlos-${{ matrix.app }}:ci
          cache-from: type=gha,scope=image-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.app }}

      # The boot-value check infra/deploy.sh runs in the new cms image before
      # `up` (v0.30), fed a compose config's cms environment on stdin: its
      # path and imports in the real image; what the cms accepts passes, and
      # a misspelt zone or an unknown role is refused with the cms's message.
      - name: Boot-value check in the cms image
        if: matrix.app == 'cms'
        run: |
          check() {
            printf '{"services":{"cms":{"environment":%s}}}' "$1" |
              docker run --rm -i --network none --entrypoint node sinnlos-cms:ci dist/scripts/check-boot-env.js
          }
          check '{}'
          check '{"APP_TIME_ZONE":"Europe/Berlin\t","MFA_REQUIRED_ROLES":"none\t"}'
          check '{"APP_TIME_ZONE":"europe/berlin","MFA_REQUIRED_ROLES":"admin_role, editor"}'
          refused() {
            if out="$(check "$1" 2>&1)"; then
              echo "::error::check-boot-env.js accepted $1"
              exit 1
            fi
            echo "${out}"
            grep -qF "$2" <<<"${out}"
          }
          refused '{"APP_TIME_ZONE":"Europe/Berln"}' 'APP_TIME_ZONE must be an IANA time zone name'
          refused '{"MFA_REQUIRED_ROLES":"admin_role,Bogus"}' 'MFA_REQUIRED_ROLES: unknown role Bogus'

  # The production images for arm64 (the owner's host), built natively on a
  # standard arm64 runner (free for public repositories), tagged with the
  # full commit and pushed to ghcr.io/yurtbayemre/sinnlos-<app>, where
  # infra/deploy.sh pulls them with DEPLOY_IMAGE_SOURCE=registry: on a push to
  # main once every check passed, and by hand ("Run workflow" with publish)
  # to prove a branch before its merge.
  #
  # The packages stay PRIVATE: publication waits for the lawyer review of the
  # notices and the Strapi Enterprise packages (owner decision 2026-10-22,
  # release-images.yml). The owner created both packages once by hand, private,
  # and gave this repository write access. The job reads each package's
  # visibility before it pushes anything and fails unless it is "private" (a
  # missing package, an error or any other answer fail too), and reads it again
  # after the push.
  publish:
    needs: [changes, build, datetime, integration, e2e, infra, images]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    name: publish · ${{ matrix.app }} (arm64, private)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    # No package permission for GITHUB_TOKEN, and the repository has no
    # Actions access to the packages: a fork's pull request could otherwise
    # change a workflow to read the private images with GITHUB_TOKEN. The
    # owner's token lives in a repository secret, which fork runs never get.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        app: [cms, web]
    env:
      APP: ${{ matrix.app }}
      IMAGE: ghcr.io/yurtbayemre/sinnlos-${{ matrix.app }}:${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # shell: bash runs with pipefail, so a curl error fails the step even when
      # the part of the answer it printed would read private.
      - name: The package is private (before the push)
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_PUBLISH_TOKEN }}
        run: |
          if [[ -z "${GHCR_TOKEN}" ]]; then
            echo "::error::the repository secret GHCR_PUBLISH_TOKEN (a classic token with write:packages) is missing: nothing is pushed"
            exit 1
          fi
          visibility="$(curl -fsS -H "Authorization: Bearer ${GHCR_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/users/yurtbayemre/packages/container/sinnlos-${APP}" |
            python3 -c 'import json, sys; print(json.load(sys.stdin).get("visibility", ""))')"
          if [[ "${visibility}" != private ]]; then
            echo "::error::ghcr.io/yurtbayemre/sinnlos-${APP} is '${visibility:-unknown}', not private: nothing is pushed"
            exit 1
          fi

      - name: Version from package.json
        id: version
        run: echo "version=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build apps/${{ matrix.app }}/Dockerfile for arm64 (loaded, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          build-args: |
            SINNLOS_VERSION=${{ steps.version.outputs.version }}
            SINNLOS_REVISION=${{ github.sha }}
          tags: ${{ env.IMAGE }}
          load: true
          provenance: false
          cache-from: type=gha,scope=image-${{ matrix.app }}-arm64
          cache-to: type=gha,mode=max,scope=image-${{ matrix.app }}-arm64

      # The full boot-value matrix runs on amd64 (images); here the arm64 image
      # that is pushed next must start the check and refuse a bad value.
      - name: Boot-value check in the arm64 cms image
        if: matrix.app == 'cms'
        run: |
          check() {
            printf '{"services":{"cms":{"environment":%s}}}' "$1" |
              docker run --rm -i --network none --entrypoint node "${IMAGE}" dist/scripts/check-boot-env.js
          }
          check '{}'
          if out="$(check '{"APP_TIME_ZONE":"Europe/Berln"}' 2>&1)"; then
            echo "::error::check-boot-env.js accepted APP_TIME_ZONE=Europe/Berln"
            exit 1
          fi
          grep -qF 'APP_TIME_ZONE must be an IANA time zone name' <<<"${out}"

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: yurtbayemre
          password: ${{ secrets.GHCR_PUBLISH_TOKEN }}

      # The image just checked, by its local id: nothing is rebuilt.
      - name: Push ${{ env.IMAGE }}
        run: docker push "${IMAGE}"

      - name: The package is still private (after the push)
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_PUBLISH_TOKEN }}
        run: |
          if [[ -z "${GHCR_TOKEN}" ]]; then
            echo "::error::the repository secret GHCR_PUBLISH_TOKEN (a classic token with write:packages) is missing: nothing is pushed"
            exit 1
          fi
          visibility="$(curl -fsS -H "Authorization: Bearer ${GHCR_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/users/yurtbayemre/packages/container/sinnlos-${APP}" |
            python3 -c 'import json, sys; print(json.load(sys.stdin).get("visibility", ""))')"
          if [[ "${visibility}" != private ]]; then
            echo "::error::ghcr.io/yurtbayemre/sinnlos-${APP} is '${visibility:-unknown}' after the push. A public package cannot be made private again: stop this job (no further pushes) and have the owner withdraw or replace the package"
            exit 1
          fi
