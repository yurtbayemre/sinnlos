# Container logs (IN05): Docker's json-file driver with rotation, at most
# 5 files of 10 MB per container. `docker logs` and `docker compose logs`
# read across the rotated files; only the oldest lines beyond 50 MB go. The
# cms logs every request, its healthcheck included, so its [datetime] boot
# line goes after some weeks of uptime (a deploy that changes nothing of
# the cms keeps its container); infra/live-smoke.sh then asks node in the
# running cms container for the process zone.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-sinnlos}
      POSTGRES_USER: ${DATABASE_USERNAME:-sinnlos}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set}
      # psql sessions in this container (docker exec infra-db-1 psql ...) run
      # in UTC: they show timestamptz values in UTC, and any manual DDL or
      # cast on a datetime column (ALTER ... TYPE timestamp, ::timestamp)
      # must run in a UTC session, because the cms guard reads a naive
      # column as UTC wall clock. The cms pins its own sessions to UTC.
      PGTZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Unique DNS names on the project network only (IN04); see cms below.
    networks:
      default:
        aliases:
          - sinnlos-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-sinnlos}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 200
    security_opt:
      - no-new-privileges:true

  cms:
    build:
      context: ..
      dockerfile: apps/cms/Dockerfile
      # The release and commit the image is built from (its version and
      # revision labels and boot line); infra/deploy.sh sets both.
      args:
        SINNLOS_VERSION: ${SINNLOS_VERSION:-unknown}
        SINNLOS_REVISION: ${SINNLOS_REVISION:-unknown}
    restart: unless-stopped
    logging: *default-logging
    # docker-init as PID 1: it forwards SIGTERM to Strapi (which shuts down
    # gracefully on its own) and reaps zombies. Without it node is PID 1, and
    # a SIGTERM that arrives before Strapi installs its handler (the first
    # moments of a boot) is ignored until `docker stop` kills the container.
    init: true
    depends_on:
      db:
        condition: service_healthy
    # Unique DNS names for the internal URLs (IN04): DATABASE_HOST,
    # STRAPI_URL and WEB_INTERNAL_URL use sinnlos-db, sinnlos-cms and
    # sinnlos-web, aliases on this project's own network only. The service
    # names `db`, `cms` and `web` are DNS names on EVERY network a container
    # joins; in Traefik mode web and cms also sit on the shared `frontend`
    # network, where another project's `web` or `cms` would answer them too.
    # Container names (infra-cms-1, …) are unchanged; the scripts use those.
    networks:
      default:
        aliases:
          - sinnlos-cms
    environment:
      NODE_ENV: production
      # Datetime contract (docs/DEPLOYMENT.md): the cms process runs in UTC
      # (the image sets it too; a schema-changing boot refuses any other
      # zone). Business dates (today, day/week windows, anniversaries, cron
      # times, all-day events) use APP_TIME_ZONE, never the process zone.
      TZ: UTC
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Europe/Berlin}
      # Only for a database written by a cms before the datetime contract:
      # the one-time repair reads them (see infra/.env.example). Fresh
      # installs leave both empty.
      DATETIME_LEGACY_ZONE: ${DATETIME_LEGACY_ZONE:-}
      DATETIME_LEGACY_UTC_UNTIL: ${DATETIME_LEGACY_UTC_UNTIL:-}
      HOST: 0.0.0.0
      PORT: 1337
      # Secrets fail fast when unset/empty (FX13); the cms additionally
      # refuses to boot in production with a template placeholder
      # (change-me / toBeModified / <secret>, src/utils/env-guard.ts).
      APP_KEYS: ${APP_KEYS:?APP_KEYS must be set - two comma-separated values from openssl rand -base64 32}
      API_TOKEN_SALT: ${API_TOKEN_SALT:?API_TOKEN_SALT must be set - openssl rand -base64 32}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?ADMIN_JWT_SECRET must be set - openssl rand -base64 32}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT:?TRANSFER_TOKEN_SALT must be set - openssl rand -base64 32}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set - openssl rand -base64 32}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set - openssl rand -base64 32}
      DATABASE_CLIENT: postgres
      DATABASE_HOST: sinnlos-db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-sinnlos}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-sinnlos}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set}
      PUBLIC_URL: ${CMS_PUBLIC_URL}
      CORS_ORIGIN: ${WEB_PUBLIC_URL}
      # The Strapi admin panel and its APIs only for these client networks
      # (comma list of CIDRs; empty: loopback only, i.e. closed from outside;
      # infra/admin-tunnel.sh opens it through SSH). docs/INSTALL.md.
      ADMIN_ALLOW_CIDRS: ${ADMIN_ALLOW_CIDRS:-}
      # Microsoft Entra ID sign-in (D-ENTRA-01, docs/DEPLOYMENT.md "Microsoft
      # Entra ID sign-in"): off unless ENTRA_ENABLED=1, and then validated at
      # boot (an invalid value refuses the start; deploy.sh --check says which).
      # The cms verifies the ID token itself (tenant + client id) and never
      # needs the client secret. Without ENTRA_ENABLED=1 every MS_*/ENTRA_*
      # value is ignored.
      ENTRA_ENABLED: ${ENTRA_ENABLED:-0}
      MS_TENANT_ID: ${MS_TENANT_ID:-}
      MS_CLIENT_ID: ${MS_CLIENT_ID:-}
      ENTRA_EXCHANGE_SECRET: ${ENTRA_EXCHANGE_SECRET:-}
      ENTRA_SYNC_MODE: ${ENTRA_SYNC_MODE:-dry-run}
      ENTRA_DEFAULT_ROLE: ${ENTRA_DEFAULT_ROLE:-member}
      ENTRA_GROUP_ROLES: ${ENTRA_GROUP_ROLES:-}
      ENTRA_SYNC_DEPARTMENT: ${ENTRA_SYNC_DEPARTMENT:-0}
      ENTRA_SYNC_MANAGER: ${ENTRA_SYNC_MANAGER:-0}
      ENTRA_SESSION_TTL: ${ENTRA_SESSION_TTL:-12h}
      # OIDC sign-in with Keycloak, authentik or Zitadel (v0.25.0,
      # docs/DEPLOYMENT.md "OIDC sign-in"): off unless OIDC_ENABLED=1, then
      # validated at boot like Entra; never together with ENTRA_ENABLED=1.
      # The cms verifies the ID token itself (discovery of OIDC_ISSUER,
      # audience OIDC_CLIENT_ID) and never needs the client secret.
      OIDC_ENABLED: ${OIDC_ENABLED:-0}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_EXCHANGE_SECRET: ${OIDC_EXCHANGE_SECRET:-}
      OIDC_ROLES_CLAIM: ${OIDC_ROLES_CLAIM:-roles}
      OIDC_DEPARTMENT_CLAIM: ${OIDC_DEPARTMENT_CLAIM:-}
      OIDC_ZITADEL_ORG_ID: ${OIDC_ZITADEL_ORG_ID:-}
      OIDC_DEFAULT_ROLE: ${OIDC_DEFAULT_ROLE:-deny}
      OIDC_SESSION_TTL: ${OIDC_SESSION_TTL:-12h}
      OIDC_ALLOW_HTTP: ${OIDC_ALLOW_HTTP:-0}
      # Local e-mail + password sign-in next to an identity provider
      # (break-glass). The cms mirrors it into users-permissions'
      # grant.email; with no identity provider on, local sign-in is always on.
      AUTH_LOCAL_ENABLED: ${AUTH_LOCAL_ENABLED:-0}
      # v0.27: the roles whose local accounts must use a second factor
      # (TOTP); empty = admin_role,editor (the default), `none` = nobody.
      MFA_REQUIRED_ROLES: ${MFA_REQUIRED_ROLES:-}
      # v0.28: modules and features switched off (a comma list, empty = all
      # on); the same value as the web. An unknown name refuses the boot.
      FEATURES_OFF: ${FEATURES_OFF:-}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-0}
      # Admin seed — auto-create first Strapi admin on fresh database.
      # Refused (error log, no admin) for template placeholders and
      # passwords failing the admin policy (FX13, src/utils/admin-seed.ts).
      STRAPI_ADMIN_EMAIL: ${STRAPI_ADMIN_EMAIL:-}
      STRAPI_ADMIN_PASSWORD: ${STRAPI_ADMIN_PASSWORD:-}
      # Live-event pings → Next.js: WEB_INTERNAL_URL is only the target of
      # POST /api/live/emit and the secret guards only that ingest (the
      # cache-revalidation webhook is gone, D-DC01; names kept).
      WEB_INTERNAL_URL: http://sinnlos-web:3000
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?REVALIDATE_SECRET must be set - openssl rand -hex 32, same value for cms and web}
      # Kill switch for the live SSE pipeline (issue #17/#27): 1 = emitter
      # no-ops and the app runs byte-for-byte on the pre-SSE polling.
      LIVE_EVENTS_DISABLED: ${LIVE_EVENTS_DISABLED:-0}
      # Scheduled jobs (the every-minute scheduled publisher; uploads,
      # search-log, notification, classified and audit janitors; digest
      # mailer): unset or true runs them; false (also 0/no/off) switches
      # these seven off in this process (Strapi's own metrics jobs run on).
      # Off, nothing scheduled publishes or unpublishes; the next run after
      # switching it back on catches up. The cms reads it like its other
      # on/off switches (apps/cms/src/cron/registry.ts, LF03).
      CRON_ENABLED: ${CRON_ENABLED:-true}
      # Days the content activity trail (audit_events) is kept; the
      # 03:50 audit-janitor deletes older rows. Empty = 365.
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-}
      # Days the search telemetry (search_logs) is kept; the 03:35
      # search-log janitor deletes older rows. Empty = 90; 1 to 3650, any
      # other value refuses the cms boot (v0.28).
      SEARCH_LOG_RETENTION_DAYS: ${SEARCH_LOG_RETENTION_DAYS:-}
      # v0.28: years a training receipt is kept after its deadline (the
      # valid-until day, or the departure of an anonymised person); the
      # 03:25 training-evidence-janitor deletes older ones. Empty = 3; a
      # whole number from 1 to 30, anything else refuses the boot.
      TRAINING_EVIDENCE_RETENTION_YEARS: ${TRAINING_EVIDENCE_RETENTION_YEARS:-}
      # No usage telemetry to Strapi; also spares a stop the telemetry
      # lookups that run into the DNS timeout on a host without DNS (B05).
      STRAPI_TELEMETRY_DISABLED: ${STRAPI_TELEMETRY_DISABLED:-true}
      # E-mail digests (issue #18): authenticated submission against the
      # own mailcow (mail.yurtbay.dev:587 STARTTLS). SMTP_USER/PASS = a
      # mailbox app password (SMTP-only) — without them the digest cron
      # is a logged no-op. Deliberately NOT attached to the mailcow
      # docker network (documented update landmine).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      # Sender and digest link base come from env only (FX13, no
      # owner-domain defaults): with SMTP_* set but DIGEST_FROM empty the
      # cron skips every run (error log) and infra/deploy.sh refuses to
      # deploy — set it, or DIGESTS_DISABLED=1. PUBLIC_WEB_URL defaults to
      # the web's public origin.
      DIGEST_FROM: ${DIGEST_FROM:-}
      DIGEST_REPLY_TO: ${DIGEST_REPLY_TO:-}
      DIGESTS_DISABLED: ${DIGESTS_DISABLED:-0}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-${WEB_PUBLIC_URL}}
      # Digest language for a user whose profile has none (en or de,
      # default en like the web's DEFAULT_LOCALE; AC04).
      DIGEST_DEFAULT_LOCALE: ${DIGEST_DEFAULT_LOCALE:-en}
      # The web's UI language (below); the cms names an anonymised person
      # in it ("Ehemalige Person" / "Former person", v0.28).
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-en}
      # Optional search ranking (v0.21, docs/DEPLOYMENT.md "Meilisearch
      # (optional search)"): off unless MEILISEARCH_ENABLED=1. The cms keeps
      # the index sinnlos_search current with the write key; it never gets
      # the master key.
      MEILISEARCH_ENABLED: ${MEILISEARCH_ENABLED:-0}
      MEILISEARCH_URL: ${MEILISEARCH_URL:-http://sinnlos-meili:7700}
      MEILISEARCH_WRITE_KEY: ${MEILISEARCH_WRITE_KEY:-}
      # Shared secret guarding the raw /uploads bytes (issue #21, K1): the cms
      # uploads-auth middleware only serves /uploads to callers presenting this
      # token, i.e. the web session-gate proxy — closing the /api/../uploads
      # traversal side channel that routes around the edge. Required: unset
      # in production means every /uploads request 404s (fail closed).
      INTERNAL_UPLOAD_TOKEN: ${INTERNAL_UPLOAD_TOKEN:?INTERNAL_UPLOAD_TOKEN must be set - openssl rand -hex 32, same value for cms and web}
    volumes:
      - cms_uploads:/app/apps/cms/public/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:1337/_health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 180s
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    # No Linux capabilities (IN02), like the web: Strapi runs as `node` on
    # the unprivileged port 1337 and writes only files it owns (uploads
    # volume, sharp's image formats), so it needs none of Docker's defaults.
    cap_drop:
      - ALL

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        SINNLOS_VERSION: ${SINNLOS_VERSION:-unknown}
        SINNLOS_REVISION: ${SINNLOS_REVISION:-unknown}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      cms:
        condition: service_healthy
    # Unique DNS name on the project network only (IN04); see cms above.
    networks:
      default:
        aliases:
          - sinnlos-web
    environment:
      NODE_ENV: production
      # Datetime contract (docs/DEPLOYMENT.md §3.10): since its datetime port
      # (phase 2) the web renders and computes every date in APP_TIME_ZONE
      # explicitly, so its process runs in UTC like the cms (the image sets
      # it too). A web image from BEFORE that port renders in its process
      # zone and refuses to start in UTC: roll back to one only with
      # infra/docker-compose.web-legacy-tz.yml on top (infra/deploy.sh prints
      # it).
      TZ: UTC
      # Business and display zone: "today", event days, ad expiry, poll
      # deadlines ("closes on D" = D 23:59:59 there), every rendered date;
      # validated at server start (src/instrumentation.ts).
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Europe/Berlin}
      HOSTNAME: 0.0.0.0
      PORT: 3000
      STRAPI_URL: http://sinnlos-cms:1337
      STRAPI_PUBLIC_URL: ${CMS_PUBLIC_URL}
      # (NEXT_PUBLIC_APP_URL/NAME and STRAPI_ADMIN_* are not passed any more:
      # the web reads none of them, and NEXT_PUBLIC_* would only take effect
      # at build time anyway — FX13.)
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set - openssl rand -base64 32}
      AUTH_URL: ${WEB_PUBLIC_URL}
      AUTH_TRUST_HOST: "true"
      # Default UI language (en or de, default en) for a visitor who has
      # not picked one with the language switch (which also stores the
      # choice on the profile for the digests).
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-en}
      # Local credentials next to an identity provider (break-glass); with
      # neither ENTRA_ENABLED nor OIDC_ENABLED 1, local sign-in is always on.
      AUTH_LOCAL_ENABLED: ${AUTH_LOCAL_ENABLED:-0}
      # Microsoft Entra ID sign-in (D-ENTRA-01): off unless ENTRA_ENABLED=1,
      # then validated at start. The issuer is computed from the tenant GUID
      # (AUTH_MICROSOFT_ENTRA_ID_ISSUER is gone); ENTRA_EXCHANGE_SECRET must
      # equal the cms's; ENTRA_SYNC_MANAGER=1 adds the User.Read.All scope.
      ENTRA_ENABLED: ${ENTRA_ENABLED:-0}
      AUTH_MICROSOFT_ENTRA_ID_TENANT_ID: ${MS_TENANT_ID:-}
      AUTH_MICROSOFT_ENTRA_ID_ID: ${MS_CLIENT_ID:-}
      AUTH_MICROSOFT_ENTRA_ID_SECRET: ${MS_CLIENT_SECRET:-}
      ENTRA_EXCHANGE_SECRET: ${ENTRA_EXCHANGE_SECRET:-}
      ENTRA_SYNC_MANAGER: ${ENTRA_SYNC_MANAGER:-0}
      # OIDC sign-in (v0.25.0): off unless OIDC_ENABLED=1, then validated at
      # start; OIDC_EXCHANGE_SECRET must equal the cms's. OIDC_ZITADEL_ORG_ID
      # adds Zitadel's organisation scopes (the cms checks the organisation).
      OIDC_ENABLED: ${OIDC_ENABLED:-0}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_EXCHANGE_SECRET: ${OIDC_EXCHANGE_SECRET:-}
      OIDC_SCOPE: ${OIDC_SCOPE:-openid profile email}
      OIDC_DISPLAY_NAME: ${OIDC_DISPLAY_NAME:-Single Sign-On}
      OIDC_ZITADEL_ORG_ID: ${OIDC_ZITADEL_ORG_ID:-}
      OIDC_ALLOW_HTTP: ${OIDC_ALLOW_HTTP:-0}
      # Shared secret for the /api/live/emit live-event ingest called from
      # the CMS (its only use since D-DC01; the name is historical).
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?REVALIDATE_SECRET must be set - openssl rand -hex 32, same value for cms and web}
      # Kill switch for the live SSE pipeline: 1 = /live/stream 404s and
      # the wrappers poll at the pre-SSE 10s/30s intervals.
      LIVE_EVENTS_DISABLED: ${LIVE_EVENTS_DISABLED:-0}
      # Shared secret the /uploads proxy route sends to cms (issue #21, K1).
      INTERNAL_UPLOAD_TOKEN: ${INTERNAL_UPLOAD_TOKEN:?INTERNAL_UPLOAD_TOKEN must be set - openssl rand -hex 32, same value for cms and web}
      # Optional search ranking (v0.21): off unless MEILISEARCH_ENABLED=1.
      # The web asks Meilisearch (search-only key, server side) for ranked
      # candidates and reads them through Strapi with the user's JWT; on any
      # Meilisearch error it uses its own search.
      MEILISEARCH_ENABLED: ${MEILISEARCH_ENABLED:-0}
      MEILISEARCH_URL: ${MEILISEARCH_URL:-http://sinnlos-meili:7700}
      MEILISEARCH_SEARCH_KEY: ${MEILISEARCH_SEARCH_KEY:-}
      # v0.28: the same switch list as the cms (navigation, pages, search).
      FEATURES_OFF: ${FEATURES_OFF:-}
      # Footer links and analytics (v0.26, infra/.env.example), all optional.
      SOURCE_URL: ${SOURCE_URL:-}
      PRIVACY_URL: ${PRIVACY_URL:-}
      IMPRINT_URL: ${IMPRINT_URL:-}
      WHISTLEBLOWING_URL: ${WHISTLEBLOWING_URL:-}
      PLAUSIBLE_SCRIPT_URL: ${PLAUSIBLE_SCRIPT_URL:-}
      PLAUSIBLE_DOMAIN: ${PLAUSIBLE_DOMAIN:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Optional search ranking (v0.21, docs/DEPLOYMENT.md "Meilisearch
  # (optional search)"): runs only with COMPOSE_PROFILES=search in
  # infra/.env. It ranks search candidates; Strapi still decides who reads
  # what, and the web falls back to its own search while it is off, down or
  # empty, so cms and web do not depend on it. The index is rebuilt from the
  # database (no backup needed). MEILI_MASTER_KEY stays in this container:
  # the cms and the web get restricted keys (infra/meilisearch/provision-keys.sh).
  # Runs as root (the image has no user and /meili_data is root's), with no
  # Linux capability at all.
  meili:
    image: getmeili/meilisearch:v1.54.3@sha256:e68913ab7d6f5b159529e472cfd362ce3c741fafd3c127961b2142abbe41b3c9
    profiles: ["search"]
    restart: unless-stopped
    logging: *default-logging
    # Unique DNS name on the project network only (IN04); see cms above.
    networks:
      default:
        aliases:
          - sinnlos-meili
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
      MEILI_MAX_INDEXING_MEMORY: 256MiB
      MEILI_MAX_INDEXING_THREADS: "1"
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7700/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - web
      - cms
    # v0.29: the image's own command, after turning SITE_ALLOW_CIDRS (comma-
    # separated, unset = everyone) into the space-separated
    # SITE_ALLOW_RANGES the Caddyfile's gate reads.
    command:
      - sh
      - -c
      - >-
        export SITE_ALLOW_RANGES="$$(printf '%s' "$${SITE_ALLOW_CIDRS:-0.0.0.0/0,::/0}" | tr ',' ' ')";
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    environment:
      # The site address of infra/Caddyfile: a real host name gets a Let's
      # Encrypt certificate (and HSTS), unset means localhost with Caddy's
      # internal CA, http://localhost plain HTTP.
      DOMAIN: ${DOMAIN:-localhost}
      # v0.29: closes the site to every other source network (see command).
      SITE_ALLOW_CIDRS: ${SITE_ALLOW_CIDRS:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 128
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
  cms_uploads:
  caddy_data:
  caddy_config:
  meili_data:
