# VPS-Override: Traefik (Host) statt Caddy auf 80/443.
#   docker compose -f docker-compose.yml -f docker-compose.traefik.yml up -d
# Routing spiegelt das Caddyfile: /api/auth/* -> web, Strapi-Pfade -> cms,
# Rest -> web. TLS via Host-Traefik (certresolver lehttp).
services:
  caddy:
    profiles: ["manual"]   # auf diesem Host übernimmt Traefik

  web:
    networks:
      - default
      - frontend
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      # Parität zum Caddyfile: Security-Header + Kompression
      - "traefik.http.middlewares.sinnlos-headers.headers.customresponseheaders.X-Content-Type-Options=nosniff"
      - "traefik.http.middlewares.sinnlos-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      # HSTS: erzwingt HTTPS für sinnlos.yurtbay.dev (1 Jahr, inkl. Subdomains)
      - "traefik.http.middlewares.sinnlos-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.sinnlos-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.sinnlos-compress.compress=true"
      # Clickjacking-Schutz: X-Frame-Options: DENY (am bestehenden Header-Middleware)
      - "traefik.http.middlewares.sinnlos-headers.headers.frameDeny=true"
      # Restriktive Permissions-Policy: das Intranet braucht keine Sensor-/Media-APIs
      - "traefik.http.middlewares.sinnlos-headers.headers.customresponseheaders.Permissions-Policy=camera=(), microphone=(), geolocation=(), payment=(), usb=()"
      # Rate-Limit gegen Brute-Force (pro Client-IP) — nur auf Auth-/CMS-Router
      - "traefik.http.middlewares.sinnlos-ratelimit.ratelimit.average=100"
      - "traefik.http.middlewares.sinnlos-ratelimit.ratelimit.burst=100"
      - "traefik.http.middlewares.sinnlos-ratelimit.ratelimit.period=1s"
      # Schärferes Limit für die Login-/Register-POSTs (Server Actions, die
      # sonst am ungebremsten Catch-all hängen — Issue #23). Edge-Limit ist
      # nur Grobschutz und zählt auch ERFOLGREICHE Logins — daher NAT-
      # freundlich dimensioniert (Montagmorgen hinter einer Büro-NAT-IP darf
      # nicht 429en). Autoritativ bleibt der App-Limiter in
      # apps/web/src/lib/login-rate-limit.ts: Server-Action-POSTs sind nicht
      # pfadgebunden, /api/auth/callback/local ruft authorize() direkt auf,
      # und nur der App-Limiter zählt ausschließlich Fehlversuche.
      - "traefik.http.middlewares.sinnlos-authlimit.ratelimit.average=10"
      - "traefik.http.middlewares.sinnlos-authlimit.ratelimit.burst=20"
      - "traefik.http.middlewares.sinnlos-authlimit.ratelimit.period=1s"
      - "traefik.http.routers.sinnlos-signin.rule=Host(`sinnlos.yurtbay.dev`) && (Path(`/sign-in`) || Path(`/register`)) && Method(`POST`)"
      - "traefik.http.routers.sinnlos-signin.priority=90"
      - "traefik.http.routers.sinnlos-signin.entrypoints=websecure"
      - "traefik.http.routers.sinnlos-signin.tls.certresolver=lehttp"
      - "traefik.http.routers.sinnlos-signin.service=sinnlos-web"
      - "traefik.http.routers.sinnlos-signin.middlewares=sinnlos-headers,sinnlos-authlimit,sinnlos-compress"
      # Auth.js-Callbacks VOR dem Strapi-/api-Catch-all
      - "traefik.http.routers.sinnlos-auth.rule=Host(`sinnlos.yurtbay.dev`) && PathPrefix(`/api/auth`)"
      - "traefik.http.routers.sinnlos-auth.priority=100"
      - "traefik.http.routers.sinnlos-auth.entrypoints=websecure"
      - "traefik.http.routers.sinnlos-auth.tls.certresolver=lehttp"
      - "traefik.http.routers.sinnlos-auth.service=sinnlos-web"
      - "traefik.http.routers.sinnlos-auth.middlewares=sinnlos-headers,sinnlos-ratelimit,sinnlos-compress"
      # Catch-all -> Next.js
      - "traefik.http.routers.sinnlos-web.rule=Host(`sinnlos.yurtbay.dev`)"
      - "traefik.http.routers.sinnlos-web.priority=1"
      - "traefik.http.routers.sinnlos-web.entrypoints=websecure"
      - "traefik.http.routers.sinnlos-web.tls.certresolver=lehttp"
      - "traefik.http.routers.sinnlos-web.service=sinnlos-web"
      - "traefik.http.routers.sinnlos-web.middlewares=sinnlos-headers,sinnlos-compress"
      - "traefik.http.services.sinnlos-web.loadbalancer.server.port=3000"

  cms:
    networks:
      - default
      - frontend
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      # `/upload` (no trailing s) is the media-library admin API — distinct
      # from `/uploads`, which serves the stored file bytes. Without it those
      # calls fall through to the web catch-all, which answers the admin's
      # XHR with a sign-in redirect instead of JSON and crashes the media
      # library. `/uploads` is deliberately ABSENT since issue #21: it falls
      # to the web catch-all, where the session-gated proxy route
      # (apps/web/src/app/uploads/[...path]/route.ts) serves the bytes —
      # admin media-library thumbnails therefore need a parallel intranet
      # session in the same browser. CAUTION: Traefik's PathPrefix is a RAW
      # string prefix (verified against Traefik 3.7: `/email` matches
      # `/emailXYZ`), so `PathPrefix(`/upload`)` would still swallow
      # `/uploads` — hence the segment-exact `Path(`/upload`) ||
      # PathPrefix(`/upload/`)` pair. Guarded by infra/routing-parity.test.ts.
      - "traefik.http.routers.sinnlos-cms.rule=Host(`sinnlos.yurtbay.dev`) && (PathPrefix(`/api`) || PathPrefix(`/admin`) || Path(`/upload`) || PathPrefix(`/upload/`) || PathPrefix(`/email`) || PathPrefix(`/content-manager`) || PathPrefix(`/content-type-builder`) || PathPrefix(`/users-permissions`) || PathPrefix(`/i18n`) || PathPrefix(`/content-api`))"
      - "traefik.http.routers.sinnlos-cms.priority=50"
      - "traefik.http.routers.sinnlos-cms.entrypoints=websecure"
      - "traefik.http.routers.sinnlos-cms.tls.certresolver=lehttp"
      - "traefik.http.routers.sinnlos-cms.service=sinnlos-cms"
      - "traefik.http.routers.sinnlos-cms.middlewares=sinnlos-headers,sinnlos-ratelimit,sinnlos-compress"
      - "traefik.http.services.sinnlos-cms.loadbalancer.server.port=1337"

networks:
  frontend:
    external: true
